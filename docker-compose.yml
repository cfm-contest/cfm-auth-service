
services:
  api:
    build: .
    container_name: cfm-auth-api
    restart: unless-stopped
    command: python app/manage.py runserver 0.0.0.0:8080
    ports:
      - "8080:8080"

  bot:
    build: .
    container_name: cfm-auth-bot
    restart: unless-stopped
    command: python app/manage.py botrun
