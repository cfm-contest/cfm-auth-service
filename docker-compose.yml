
services:
  api:
    build: .
    container_name: cfm-auth-api
    restart: unless-stopped
    command: sh -c "python app/manage.py migrate --noinput && python app/manage.py runbolt --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    volumes:
      - ./app/db.sqlite3:/app/app/db.sqlite3

  bot:
    build: .
    container_name: cfm-auth-bot
    restart: unless-stopped
    command: python app/manage.py botrun
    volumes:
      - ./app/db.sqlite3:/app/app/db.sqlite3
